<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AbuseIPDB Lookup Online</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #f0f6fc; font-size: 22px; margin-bottom: 16px; }
    .box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    label { font-size: 13px; font-weight: bold; color: #f0f6fc; display: block; margin-bottom: 6px; }
    textarea { width: 100%; background: #010409; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 6px; font-family: Consolas, monospace; font-size: 13px; }
    button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 10px 24px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; color: white; }
    .badge-safe { background: #238636; }
    .badge-warn { background: #d29922; color: #000; }
    .badge-danger { background: #da3633; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 12px 0; }
    .item { background: #0d1117; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; font-size: 12px; }
    .item span { color: #8b949e; display: block; font-size: 11px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { border: 1px solid #30363d; padding: 8px; text-align: left; }
    th { background: #0d1117; color: #8b949e; }
    tr:nth-child(even) { background: #12161c; }
    .tag { background: #21262d; border: 1px solid #30363d; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin: 1px; display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <h1>🛡️ AbuseIPDB Threat Lookup</h1>

  <div class="box">
    <label for="ipList">Endereços IP (um por linha ou separados por vírgula):</label>
    <textarea id="ipList" rows="3">187.122.58.197, 8.8.8.8</textarea>
    <button id="btnConsultar" onclick="consultar()">Consultar IPs</button>
  </div>

  <div id="status" style="margin-bottom: 12px; font-size: 13px; color: #58a6ff;"></div>
  <div id="resultados"></div>
</div>

<script>
const API_KEY = "569d1feeeb21f8dc36c89d882cfb82e759ba962ed372e020305d16260431dd7c773561ee6ad711c9";

const CATS = {
  1: "DNS Compromise", 2: "DNS Poisoning", 3: "Fraud Orders", 4: "DDoS Attack",
  5: "FTP Brute-Force", 6: "Ping of Death", 7: "Phishing", 8: "Fraud VoIP",
  9: "Open Proxy", 10: "Web Spam", 11: "Email Spam", 12: "Blog Spam",
  13: "VPN IP", 14: "Port Scan", 15: "Hacking", 16: "SQL Injection",
  17: "Spoofing", 18: "Brute-Force", 19: "Bad Web Bot", 20: "Exploited Host",
  21: "Web App Attack", 22: "SSH", 23: "IoT Targeted"
};

async function consultar() {
  const input = document.getElementById("ipList").value.trim();
  const resContainer = document.getElementById("resultados");
  const statusDiv = document.getElementById("status");
  const btn = document.getElementById("btnConsultar");

  const ips = input.split(/[\s,;]+/).filter(Boolean);
  if (!ips.length) return;

  btn.disabled = true;
  resContainer.innerHTML = "";
  statusDiv.innerText = `Consultando ${ips.length} IP(s)...`;

  for (const ip of ips) {
    try {
      const target = `https://api.abuseipdb.com/api/v2/check?ipAddress=${encodeURIComponent(ip)}&maxAgeInDays=365&verbose=true`;
      const proxy = `https://corsproxy.io/?url=${encodeURIComponent(target)}`;

      const res = await fetch(proxy, {
        method: "GET",
        headers: { "Key": API_KEY, "Accept": "application/json" }
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      const d = json.data;

      let badge = "badge-safe";
      if (d.abuseConfidenceScore > 50) badge = "badge-danger";
      else if (d.abuseConfidenceScore > 0) badge = "badge-warn";

      let rows = "";
      if (d.reports && d.reports.length > 0) {
        rows = d.reports.map(r => {
          const tags = (r.categories || []).map(c => `<span class="tag">${CATS[c] || 'Cat ' + c}</span>`).join(" ");
          return `<tr><td>User #${r.reporterId || 'Anon'} (${r.reporterCountryCode || 'N/A'})</td><td>${r.reportedAt}</td><td>${tags}</td><td>${r.comment || '<i>Sem comentário</i>'}</td></tr>`;
        }).join("");
      }

      resContainer.innerHTML += `
        <div class="card">
          <div class="header">
            <h2 style="margin:0; font-size:17px; color:#fff;">${d.ipAddress}</h2>
            <span class="badge ${badge}">Score: ${d.abuseConfidenceScore}%</span>
          </div>
          <div class="grid">
            <div class="item"><span>ISP</span><strong>${d.isp || 'N/A'}</strong></div>
            <div class="item"><span>Tipo</span><strong>${d.usageType || 'N/A'}</strong></div>
            <div class="item"><span>Domínio</span><strong>${d.domain || 'N/A'}</strong></div>
            <div class="item"><span>País</span><strong>${d.countryName || 'N/A'} (${d.countryCode || 'N/A'})</strong></div>
            <div class="item"><span>Denúncias</span><strong>${d.totalReports}</strong></div>
          </div>
          ${rows ? `<table><thead><tr><th>Reporter</th><th>Data (UTC)</th><th>Categorias</th><th>Comentário</th></tr></thead><tbody>${rows}</tbody></table>` : '<p style="font-size:12px; color:#8b949e;">Nenhuma denúncia detalhada registrada.</p>'}
        </div>`;
    } catch (e) {
      resContainer.innerHTML += `<div class="card" style="border-color:#da3633;"><b style="color:#f85149;">[${ip}] Erro:</b> ${e.message}</div>`;
    }
  }

  statusDiv.innerText = "Consultas finalizadas.";
  btn.disabled = false;
}
</script>

</body>
</html>
